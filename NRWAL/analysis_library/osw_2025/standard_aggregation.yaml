# Installation Costs
install: turbine_install + sub_install + array_install + export_install # derived for 150 MW

# Electrical System Costs (NO OSS)
electrical: array + export # derived for 150 MW - export includes onshore substation and short spur line

# Subcomponents
subcomponents: substructure + foundation + install + electrical

# Construction Insurance 
constr_ins: construction_insurance * (bos + turbine)

# Decommissioning
decomm: decomissioning * (install)

# Project Completion (Commissioning)
proj_comp: project_completion * (bos + turbine)

# Procurement Contingency
procurement_cont: procurement_contingency * (bos - install + turbine)

# Installation Contingency 
install_cont: install_contingency * (install)

# Construction Financing
cons_financing: (confin_factor - 1) * (constr_ins + decomm + proj_comp + procurement_cont + install_cont + bos + turbine)

# Soft Costs
soft: constr_ins + decomm + proj_comp + procurement_cont + install_cont + cons_financing

# Total CapEx for Plant
capex_scaled: ((bos + soft + turbine) * capex_multi)

#LCOE 150 MW
lcoe_fcr: (capex * fixed_charge_rate + opex) / (cf_mean  * 150 * 8760)
